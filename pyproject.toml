[project]
name = "trial-conversion-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "leassis91", email = "leassis.destefani@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "logging>=0.4.9.6",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0.52",
    "xgboost>=3.2.0",
]

[project.scripts]
trial-conversion-model = "trial_conversion_model:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]
